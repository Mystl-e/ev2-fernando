{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Películas{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home_fernando:inicio' %}">CineGéneros</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'home_fernando:inicio' %}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'home_fernando:genero_detalle' 'accion' %}">Acción</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'home_fernando:genero_detalle' 'ciencia-ficcion' %}">Ciencia Ficción</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'home_fernando:genero_detalle' 'drama' %}">Drama</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-muted py-3 border-top">
    <small>Proyecto Django - Fernando</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
